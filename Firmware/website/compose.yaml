services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      GROWHUB_DB_PATH: /data/growhub.db
      GROWHUB_DEVICE_KEY: ${GROWHUB_DEVICE_KEY:-dev-device-key}
      GROWHUB_AI_KEY: ${GROWHUB_AI_KEY:-dev-ai-key}
      GROWHUB_STOCK_IMAGES_DIR: /stock_images
      GROWHUB_WEB_ORIGIN_REGEX: ${GROWHUB_WEB_ORIGIN_REGEX:-}
      GROWHUB_COOKIE_SECURE: ${GROWHUB_COOKIE_SECURE:-0}
      GROWHUB_PUBLIC_URL: ${GROWHUB_PUBLIC_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      GROWHUB_EMAIL_FROM: ${GROWHUB_EMAIL_FROM:-}
    volumes:
      - growhub-data:/data
      - ./stock_images:/stock_images:ro,z
    restart: unless-stopped

  ai:
    build: ./ai
    ports:
      - "8001:8001"
    environment:
      GROWHUB_API_BASE: http://backend:8000
      GROWHUB_AI_KEY: ${GROWHUB_AI_KEY:-dev-ai-key}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-google/gemini-2.5-flash}
      REVIEW_INTERVAL_MINUTES: ${REVIEW_INTERVAL_MINUTES:-30}
      GROWHUB_WEB_ORIGIN_REGEX: ${GROWHUB_WEB_ORIGIN_REGEX:-}
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "5000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro,z
    restart: unless-stopped

  simulator:
    build: ./backend
    command: ["python", "esp32_simulator.py"]
    environment:
      GROWHUB_API_BASE: http://backend:8000
      GROWHUB_DEVICE_KEY: ${GROWHUB_DEVICE_KEY:-dev-device-key}
      CAMERA_INDEX: "0"
    devices:
      - /dev/video0:/dev/video0
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  growhub-data:

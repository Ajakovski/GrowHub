<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="referrer" content="no-referrer">
	<title>GrowHub | Verify email</title>
	<link rel="stylesheet" href="css/styles.css">
	<link rel="icon" href="assets/img/favicon.svg">
</head>
<body>
	<header class="site-header">
	    <div class="container header-inner">
			<a href="index.html" class="brand focus-strip" aria-label="GrowHub home">
			    <img src="assets/img/growhub.svg" alt="GrowHub logo" />
			</a>
			<button class="nav-toggle" data-nav-toggle aria-expanded="false" aria-label="Toggle Menu">Menu</button>
			<nav class="nav-menu" data-nav-menu aria-label="Primary">
			    <a href="index.html#products" class="nav-link">Products</a>
				<a href="shop.html" class="nav-link">Catalog</a>
				<a href="dashboard.html" class="nav-link">Dashboard</a>
				<a href="index.html#contact" class="nav-link navcta">Contact</a>
			</nav>
		</div>
	</header>

	<main class="section auth-page">
	    <div class="container">
			<section class="auth-card" aria-labelledby="verify-title">
			    <span class="kicker">GrowHub Account</span>
				<h1 class="section-title" id="verify-title">Verifying your email...</h1>
				<p class="section-lead" id="verify-message" role="status">Hang on a second.</p>
				<a href="login.html" class="btn btn-primary" id="verify-action" hidden>Go to log in</a>
			</section>
		</div>
	</main>

	<footer class="site-footer">
	    <div class="container footer-inner">
			<p>GrowHub</p>
			<p>&copy; <span data-year></span> GrowHub. Built to grow better, everywhere.</p>
		</div>
	</footer>

	<script src="js/main.js"></script>
	<script src="js/verify.js"></script>
</body>
</html>
